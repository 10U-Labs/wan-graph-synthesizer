---
# Department of the Air Force WAN design restricted to the continental United
# States: the DAF roster minus the Alaska and Hawaii installations, which are
# the sites marked exempt from the distance constraint (OCONUS).
# Keys are kept alphabetical within each block to satisfy yamllint key-ordering.
access_homing_degree: 2
backbone_mesh_degree: 2
backbone_node_count:
  max: 99
  min: 3
forced_backbone_nodes:
  - Ashburn, VA
  - Boston, MA
  - Cheyenne, WY
  - Colorado Springs, CO
  - Dallas, TX
  - Great Falls, MT
  - Hillsboro, OR
  - Houston, TX
  - Los Angeles, CA
  - McLean, VA
  - Minot, ND
  - New York, NY
  - Salt Lake City, UT
  - Tallahassee, FL
forced_connections: []
inputs:
  locations:
    DAF (CONUS): data/vertices/tenants/daf_conus.csv
  off_net: data/vertices/utilities/off_net.csv
  providers:
    regions: data/vertices/providers/providers.csv
knobs:
  backbone_coverage_target_miles: 400.0
  backbone_set_peak_bytes: 160
  compass_octants: 8
  enum_memory_fraction: 0.6
label: DAF (CONUS)
prohibited_backbone_nodes: []
prohibited_connections: []
promote_high_degree_convergences_to_backbone_nodes: false
restrict_backbone_to_data_centers: false
