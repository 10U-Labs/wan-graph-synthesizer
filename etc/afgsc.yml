---
# AFGSC (Air Force Global Strike Command) WAN design: demand is the command's
# strike and missile access nodes -- the five bomb wings (Barksdale, Minot,
# Dyess, Ellsworth, Whiteman), three missile wings (F.E. Warren, Malmstrom,
# Minot), the two numbered air force headquarters (Eighth at Barksdale,
# Twentieth at F.E. Warren), plus the AFNWC host (Kirtland), airborne command
# and control (Offutt) and ICBM flight test (Vandenberg). Modeled after the
# DAF tenant, with coordinates extracted from the DAF roster.
# Keys are kept alphabetical within each block to satisfy yamllint key-ordering.
access_homing_degree: 2
backbone_mesh_degree: 4
backbone_node_count:
  max: 12
  min: 3
forced_backbone_nodes:
  - Albuquerque, NM
  - Ashburn, VA
  - Cheyenne, WY
  - Dallas, TX
  - Denver, CO
  - Great Falls, MT
  - Los Angeles, CA
  - Rapid City, SD
  - Salt Lake City, UT
  - St. Louis, MO
forced_connections: []
inputs:
  locations:
    AFGSC: data/vertices/tenants/afgsc.csv
  off_net: data/vertices/utilities/off_net.csv
  providers:
    regions: data/vertices/providers/providers.csv
knobs:
  backbone_coverage_target_miles: 400.0
  backbone_set_peak_bytes: 160
  compass_octants: 8
  enum_memory_fraction: 0.6
label: AFGSC
prohibited_backbone_nodes: []
prohibited_connections: []
promote_high_degree_convergences_to_backbone_nodes: false
restrict_backbone_to_data_centers: false
