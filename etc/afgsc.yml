---
# AFGSC (Air Force Global Strike Command) WAN design, validated against the
# official AFGSC / Eighth / Twentieth Air Force fact sheets (afgsc.af.mil).
# Demand is the command's strike, missile and command-and-control access nodes:
#   Eighth AF (HQ Barksdale) -- 2d BW (Barksdale, B-52), 5th BW (Minot, B-52),
#     7th BW (Dyess, B-1), 28th BW (Ellsworth, B-1), 509th BW (Whiteman, B-2),
#     95th Wing (Offutt, airborne C2; activated 28 Mar 2025).
#   Twentieth AF (HQ F.E. Warren) -- 90th MW (F.E. Warren), 91st MW (Minot),
#     341st MW (Malmstrom), 377th ABW host (Kirtland, to AFGSC 2015), and the
#     576th Flight Test Squadron ICBM launch site (Vandenberg SFB).
# Modeled after the DAF tenant, with coordinates extracted from the DAF roster.
# Keys are kept alphabetical within each block to satisfy yamllint key-ordering.
access_homing_degree: 2
backbone_mesh_degree: 4
backbone_node_count:
  max: 12
  min: 3
forced_backbone_nodes:
  - Albuquerque, NM
  - Ashburn, VA
  - Cheyenne, WY
  - Dallas, TX
  - Denver, CO
  - Great Falls, MT
  - Los Angeles, CA
  - Rapid City, SD
  - Salt Lake City, UT
  - St. Louis, MO
forced_connections: []
inputs:
  locations:
    AFGSC: data/vertices/tenants/afgsc.csv
  off_net: data/vertices/utilities/off_net.csv
  providers:
    regions: data/vertices/providers/providers.csv
knobs:
  backbone_coverage_target_miles: 400.0
  backbone_set_peak_bytes: 160
  compass_octants: 8
  enum_memory_fraction: 0.6
label: AFGSC
prohibited_backbone_nodes: []
prohibited_connections: []
promote_high_degree_convergences_to_backbone_nodes: false
restrict_backbone_to_data_centers: false
