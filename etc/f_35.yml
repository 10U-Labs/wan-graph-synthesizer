---
# F-35-only WAN design: demand is F-35 installations only (no AFLCMC/AFNWC/NI).
# Two blocks describe the design -- the meshed `backbone` and the `access` that
# homes into it. Keys are kept alphabetical within each block, nested ones
# included, to satisfy yamllint key-ordering.
access:
  homing_degree: 2
backbone:
  coverage_target_miles: 400.0
  forced:
    connections: []
    nodes:
      - Ashburn, VA
      - Cincinnati, OH
      - Colorado Springs, CO
      - Dallas, TX
      - Fort Worth, TX
      - Jacksonville, FL
      - Las Vegas, NV
      - Los Angeles, CA
      - McLean, VA
      - Pittsburgh, PA
      - Salt Lake City, UT
      - Seattle, WA
      - Tallahassee, FL
  mesh_degree: 3
  node_count:
    max: 16
    min: 3
  prohibited:
    connections: []
    nodes: []
  promote_high_degree_convergences: false
  restrict_to_data_centers: false
inputs:
  locations:
    F-35: data/vertices/tenants/f_35.csv
  off_net: data/vertices/utilities/off_net.csv
  providers:
    regions: data/vertices/providers/providers.csv
label: F-35
settings:
  backbone_search_memory_share: 0.6
  bytes_per_backbone_combination: 160
  compass_sector_count: 8
