---
# F-35-only WAN design: demand is F-35 installations only (no AFLCMC/AFNWC/NI).
# Keys are kept alphabetical within each block to satisfy yamllint key-ordering.
access_homing_degree: 2
backbone_mesh_degree: 3
backbone_node_count:
  max: 16
  min: 3
forced_backbone_nodes:
  - Ashburn, VA
  - Cincinnati, OH
  - Colorado Springs, CO
  - Dallas, TX
  - Fort Worth, TX
  - Jacksonville, FL
  - Las Vegas, NV
  - Los Angeles, CA
  - McLean, VA
  - Pittsburgh, PA
  - Salt Lake City, UT
  - Seattle, WA
  - Tallahassee, FL
forced_connections: []
inputs:
  locations:
    F-35: data/vertices/tenants/f_35.csv
  off_net: data/vertices/utilities/off_net.csv
  providers:
    regions: data/vertices/providers/providers.csv
knobs:
  backbone_coverage_target_miles: 400.0
label: F-35
prohibited_backbone_nodes: []
prohibited_connections: []
promote_high_degree_convergences_to_backbone_nodes: false
restrict_backbone_to_data_centers: false
settings:
  backbone_search_memory_share: 0.6
  bytes_per_backbone_combination: 160
  compass_sector_count: 8
