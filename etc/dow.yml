---
# DoW WAN design across every carrier's fiber.
# Keys are kept alphabetical within each block to satisfy yamllint key-ordering.
access_homing_degree: 2
backbone_mesh_degree: 3
backbone_node_count:
  max: 1000
  min: 3
forced_backbone_nodes:
  - Ashburn, VA
  - Boardman, OR
  - Cheyenne, WY
  - Cincinnati, OH
  - Colorado Springs, CO
  - Columbus, OH
  - Dallas, TX
  - Denver, CO
  - Fort Worth, TX
  - Great Falls, MT
  - Hillsboro, OR
  - Houston, TX
  - McLean, VA
  - Minot, ND
  - Phoenix, AZ
  - San Antonio, TX
  - Tucson, AZ
forced_connections: []
inputs:
  locations:
    DoW: data/vertices/tenants/dow.csv
  off_net: data/vertices/utilities/off_net.csv
  providers:
    regions: data/vertices/providers/providers.csv
knobs:
  backbone_coverage_target_miles: 50.0
  backbone_set_peak_bytes: 160
  compass_octants: 8
  enum_memory_fraction: 0.6
label: DoW
prohibited_backbone_nodes: []
prohibited_connections: []
promote_high_degree_convergences_to_backbone_nodes: true
restrict_backbone_to_data_centers: false
