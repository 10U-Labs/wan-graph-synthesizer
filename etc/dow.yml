---
# DoW WAN design across every carrier's fiber.
# Keys are kept alphabetical within each block to satisfy yamllint key-ordering.
access_homing_degree: 2
backbone_mesh_degree: 2
backbone_node_count:
  max: 30
  min: 3
forced_backbone_nodes:
  - Albany, NY
  - Ashburn, VA
  - Atlanta, GA
  - Cheyenne, WY
  - Colorado Springs, CO
  - Dallas, TX
  - Great Falls, MT
  - Las Vegas, NV
  - Los Angeles, CA
  - McLean, VA
  - New York, NY
  - Norfolk, VA
  - Salt Lake City, UT
  - San Diego, CA
  - San Francisco, CA
  - San Jose, CA
  - Seattle, WA
  - Tacoma, WA
  - Virginia Beach, VA
forced_connections: []
inputs:
  providers:
    AWS:
      - data/vertices/providers/providers.csv
      - data/vertices/providers region.csv
      - data/vertices/providers region.csv
      - data/vertices/providers region.csv
      - data/vertices/providers region.csv
    provider:
      - data/vertices/providers region.csv
      - data/vertices/providers region.csv
    provider:
      - data/vertices/providers/providers.csv
      - data/vertices/providers/providers.csv
  locations:
    DoW: data/vertices/tenants/dow.csv
  off_net: data/vertices/utilities/off_net.csv
knobs:
  backbone_coverage_target_miles: 100.0
  backbone_set_peak_bytes: 160
  compass_octants: 8
  enum_memory_fraction: 0.6
label: DoW
prohibited_backbone_nodes: []
prohibited_connections: []
promote_high_degree_convergences_to_backbone_nodes: false
restrict_backbone_to_data_centers: false
