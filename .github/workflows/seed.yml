---
concurrency:
  cancel-in-progress: false
  group: seed
jobs:
  concluding-testing-necessary:
    if: ${{ !cancelled() && needs.determining-testing.outputs.testing-necessary == 'true' }}
    name: concluding-testing-necessary
    needs: determining-testing
    runs-on: ubuntu-24.04
    steps:
      - name: No-op
        run: 'true'
  concluding-testing-unnecessary:
    if: ${{ !cancelled() && needs.determining-testing.outputs.testing-necessary == 'false' }}
    name: concluding-testing-unnecessary
    needs: determining-testing
    runs-on: ubuntu-24.04
    steps:
      - name: No-op
        run: 'true'
  concluding-yamllint-necessary:
    if: ${{ needs.determining-yamllint.outputs.yamllint-necessary == 'true' }}
    name: concluding-yamllint-necessary
    needs: determining-yamllint
    runs-on: ubuntu-24.04
    steps:
      - name: No-op
        run: 'true'
  concluding-yamllint-unnecessary:
    if: ${{ needs.determining-yamllint.outputs.yamllint-necessary == 'false' }}
    name: concluding-yamllint-unnecessary
    needs: determining-yamllint
    runs-on: ubuntu-24.04
    steps:
      - name: No-op
        run: 'true'
  determining-testing:
    if: ${{ !failure() && !cancelled() }}
    name: determining-testing
    needs:
      - concluding-yamllint-unnecessary
      - yamllint
    outputs:
      testing-necessary: ${{ steps.decide.outputs.testing-necessary }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - id: decide
        name: Decide whether static analysis and tests are necessary
        run: |
          base='${{ github.event.before }}'
          head='${{ github.sha }}'
          zero='0000000000000000000000000000000000000000'
          if [ -z "$base" ] || [ "$base" = "$zero" ] \
              || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            necessary=true
          elif git diff --name-only "$base" "$head" \
              | grep -qvE '^(data|etc)/'; then
            necessary=true
          else
            necessary=false
          fi
          echo "testing-necessary=$necessary" | tee -a "$GITHUB_OUTPUT"
  determining-yamllint:
    name: determining-yamllint
    outputs:
      yamllint-necessary: ${{ steps.decide.outputs.yamllint-necessary }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - id: decide
        name: Decide whether YAML linting is necessary
        run: |
          base='${{ github.event.before }}'
          head='${{ github.sha }}'
          zero='0000000000000000000000000000000000000000'
          if [ -z "$base" ] || [ "$base" = "$zero" ] \
              || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            necessary=true
          elif git diff --name-only "$base" "$head" \
              | grep -qE '^etc/|^\.github/workflows/seed\.yml$'; then
            necessary=true
          else
            necessary=false
          fi
          echo "yamllint-necessary=$necessary" >> "$GITHUB_OUTPUT"
  e2e-tests:
    if: ${{ !cancelled() && needs.integration-tests.result == 'success' }}
    name: e2e-tests
    needs: integration-tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Install tools
        run: pip install pytest pyyaml
      - name: Run end-to-end tests against a stub API
        run: >-
          PYTHONPATH=.:lib/python:scripts:test
          python3 -m pytest
          test/scripts/seed/e2e/
          --import-mode=importlib --confcutdir=test
          --verbose
  integration-tests:
    if: ${{ !cancelled() && needs.unit-tests.result == 'success' }}
    name: integration-tests
    needs: unit-tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Install tools
        run: pip install pytest pyyaml
      - name: Run integration tests against a mocked API
        run: >-
          PYTHONPATH=.:lib/python:scripts:test
          python3 -m pytest
          test/scripts/seed/integration/
          --import-mode=importlib --confcutdir=test
          --verbose --pythonwarnings=error
  seeding:
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' && (needs.concluding-testing-unnecessary.result == 'success' || needs.e2e-tests.result == 'success') }}
    name: seeding
    needs:
      - concluding-testing-unnecessary
      - e2e-tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Install tools
        run: pip install pyyaml
      - name: Push the git-authored inputs to the API
        run: PYTHONPATH=lib/python python3 scripts/seed.py
  static-analysis:
    if: ${{ !cancelled() && needs.concluding-testing-necessary.result == 'success' }}
    name: static-analysis
    needs: concluding-testing-necessary
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Install tools
        run: |
          pip install \
            assert-no-inline-directives \
            assert-no-linter-config-files \
            assert-one-assert-per-pytest \
            mypy pylint pytest pyyaml types-PyYAML yamllint
          npm install -g jscpd
      - name: Lint YAML
        run: |
          EMPTY='empty-lines: {max: 0, max-start: 0, max-end: 1}'
          KEY='key-ordering: enable'
          LL='line-length: disable'
          NL='new-line-at-end-of-file: enable'
          TR='truthy: {allowed-values: ["true", "false", "on"]}'
          RULES="$EMPTY, $KEY, $LL, $NL, $TR"
          yamllint --strict \
            --config-data \
            "{extends: default, rules: {$RULES}}" \
            .github/workflows/seed.yml
      - name: Assert no inline directives
        run: >-
          assert-no-inline-directives
          --tools pylint,mypy,yamllint
          --verbose
          ${{ github.workspace }}/lib/python ${{ github.workspace }}/scripts ${{ github.workspace }}/test/scripts
      - name: Assert no linter config files
        run: >-
          assert-no-linter-config-files
          --linters pylint,mypy,yamllint
          --verbose
          ${{ github.workspace }}
      - name: Assert one assert per pytest
        run: >-
          assert-one-assert-per-pytest
          --verbose
          ${{ github.workspace }}/test/scripts/seed
      - name: Run pylint on source
        run: >-
          PYTHONPATH=lib/python:scripts
          python3 -m pylint
          scripts/seed.py lib/python/test_http_doubles/
          --fail-on=C,R,W --fail-under=10.0
      - name: Run mypy on source
        run: >-
          MYPYPATH=lib/python:scripts
          python3 -m mypy --strict
          --explicit-package-bases scripts/seed.py lib/python/test_http_doubles/
      - name: Detect copy-paste in source
        run: >-
          jscpd --pattern "**/*.py" --threshold 0 --reporters console
          scripts/seed.py lib/python/test_http_doubles/
      - name: Run pylint on tests
        run: >-
          PYTHONPATH=.:lib/python:scripts:test
          python3 -m pylint --recursive=y
          test/scripts/seed/
          --fail-on=C,R,W --fail-under=10.0
      - name: Run mypy on tests
        run: >-
          MYPYPATH=lib/python:scripts:test
          python3 -m mypy --strict
          --explicit-package-bases test/scripts/seed/
      - name: Detect copy-paste in tests
        run: >-
          jscpd --pattern "test/scripts/seed/**/*.py" --threshold 0
          --reporters console test/scripts/seed/
  unit-tests:
    if: ${{ !cancelled() && needs.static-analysis.result == 'success' }}
    name: unit-tests
    needs: static-analysis
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Install tools
        run: pip install pytest pytest-cov pyyaml
      - name: Run unit tests with a 100% coverage gate
        run: >-
          PYTHONPATH=.:lib/python:scripts
          python3 -m pytest
          test/scripts/seed/unit/
          --import-mode=importlib --confcutdir=test
          --verbose --pythonwarnings=error
          --cov=seed
          --cov-branch
          --cov-report=term-missing
          --cov-fail-under=100
  yamllint:
    name: yamllint
    needs: concluding-yamllint-necessary
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Install tools
        run: pip install assert-no-inline-directives yamllint
      - name: Assert no inline directives
        run: >-
          assert-no-inline-directives
          --tools yamllint
          --verbose
          .github/workflows/seed.yml etc/
      - name: Lint YAML
        run: |
          EMPTY='empty-lines: {max: 0, max-start: 0, max-end: 1}'
          KEY='key-ordering: enable'
          LL='line-length: disable'
          NL='new-line-at-end-of-file: enable'
          TR='truthy: {allowed-values: ["true", "false", "on"]}'
          RULES="$EMPTY, $KEY, $LL, $NL, $TR"
          yamllint --strict \
            --config-data \
            "{extends: default, rules: {$RULES}}" \
            .github/workflows/seed.yml etc/afgsc.yml etc/daf.yml \
            etc/daf_conus.yml etc/dow.yml etc/f_35.yml etc/joint.yml \
            etc/minuteman.yml
name: seed
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/seed.yml
      - data/**
      - etc/**
      - lib/python/**
      - scripts/**
      - src/www/api/openapi.json
      - test/scripts/seed/**
  workflow_dispatch: {}
