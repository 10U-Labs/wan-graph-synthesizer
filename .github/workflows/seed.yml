---
concurrency:
  cancel-in-progress: false
  group: seed
jobs:
  concluding-testing-necessary:
    if: ${{ !cancelled() && needs.determining-testing.outputs.testing-necessary == 'true' }}
    name: concluding-testing-necessary
    needs: determining-testing
    runs-on: ubuntu-24.04
    steps:
      - name: No-op
        run: 'true'
  concluding-testing-unnecessary:
    if: ${{ !cancelled() && needs.determining-testing.outputs.testing-necessary == 'false' }}
    name: concluding-testing-unnecessary
    needs: determining-testing
    runs-on: ubuntu-24.04
    steps:
      - name: No-op
        run: 'true'
  concluding-yamllint-necessary:
    if: ${{ needs.determining-yamllint.outputs.yamllint-necessary == 'true' }}
    name: concluding-yamllint-necessary
    needs: determining-yamllint
    runs-on: ubuntu-24.04
    steps:
      - name: No-op
        run: 'true'
  concluding-yamllint-unnecessary:
    if: ${{ needs.determining-yamllint.outputs.yamllint-necessary == 'false' }}
    name: concluding-yamllint-unnecessary
    needs: determining-yamllint
    runs-on: ubuntu-24.04
    steps:
      - name: No-op
        run: 'true'
  determining-testing:
    if: ${{ !failure() && !cancelled() }}
    name: determining-testing
    needs:
      - concluding-yamllint-unnecessary
      - yamllint
    outputs:
      testing-necessary: ${{ steps.decide.outputs.testing-necessary }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - id: decide
        # The exclusion is data/raw/ and nothing wider. It once covered all of data/ and
        # etc/, on the reasoning that no test read either, and that reasoning expired: the
        # integration tier now asserts a tenant's backbone knobs against what the carrier
        # files say its fiber can carry, so a push editing only etc/ is the likeliest way
        # to break that contract and was exactly the push that skipped it. data/raw/ is
        # still sound to exclude, holding the carriers' published maps that the cleaned
        # vertices and edges were transcribed from, which no code opens.
        #
        # A manual run carries no github.event.before, so it has no previous commit to
        # diff against and every tier runs. That is what `gh workflow run seed.yml --ref
        # main` is for, and asking the event directly is what keeps it true: the rest of
        # this condition is about hashes, and rewriting it must not take the escape hatch
        # away by accident. cat-file covers every hash a push can leave — the all-zero one
        # a new branch sends, and one this checkout does not hold after a force push.
        name: Decide whether static analysis and tests are necessary
        run: |
          base='${{ github.event.before }}'
          head='${{ github.sha }}'
          if [ '${{ github.event_name }}' = workflow_dispatch ] \
              || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            necessary=true
          elif git diff --name-only "$base" "$head" \
              | grep -qvE '^data/raw/'; then
            necessary=true
          else
            necessary=false
          fi
          echo "testing-necessary=$necessary" | tee -a "$GITHUB_OUTPUT"
  determining-yamllint:
    name: determining-yamllint
    outputs:
      yamllint-necessary: ${{ steps.decide.outputs.yamllint-necessary }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - id: decide
        # A manual run carries no github.event.before, so it has no previous commit to
        # diff against and the linting runs. Asking the event directly says so, rather
        # than leaving it to an empty hash; see the same condition in determining-testing.
        name: Decide whether YAML linting is necessary
        run: |
          base='${{ github.event.before }}'
          head='${{ github.sha }}'
          if [ '${{ github.event_name }}' = workflow_dispatch ] \
              || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            necessary=true
          elif git diff --name-only "$base" "$head" \
              | grep -qE '^etc/|^\.github/workflows/seed\.yml$'; then
            necessary=true
          else
            necessary=false
          fi
          echo "yamllint-necessary=$necessary" >> "$GITHUB_OUTPUT"
  # Whether each tenant's published network is the one its config in etc/ asked for. That
  # question belongs to this workflow and to no other: a push editing etc/ starts this one
  # alone, and seeding is what delivers the edit and rebuilds the WANs, so this is the only
  # place the rebuild can be measured on the push that caused it. Asking it from the
  # endpoint's own workflow left every config change unmeasured, which is what it was
  # supposed to catch (GitHub issue #47).
  #
  # This is the end-to-end tier: it makes seed's own journey against the deployed API and
  # judges it on what a caller receives. It reads the published networks over the API and
  # needs no AWS credentials. The job that used to hold this name drove seed against a
  # localhost stub with nothing deployed, which is pre-deployment integration, and it runs
  # in integration-tests now (GitHub issue #49).
  e2e-tests:
    if: ${{ !cancelled() && needs.seeding.result == 'success' }}
    name: e2e-tests
    needs:
      - seeding
      - test-repo-libraries
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Install tools
        run: pip install pytest pyyaml
      - name: Check every published network against the config that asked for it
        run: >-
          PYTHONPATH=.:lib/python:scripts:src/api/endpoints/tenants/wan/post/lambdas
          python3 -m pytest
          test/scripts/seed/post_deployment/e2e/
          --import-mode=importlib --confcutdir=test
          --verbose
  integration-tests:
    if: ${{ !cancelled() && needs.unit-tests.result == 'success' }}
    name: integration-tests
    needs:
      - test-repo-libraries
      - unit-tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Install tools
        run: pip install pytest pyyaml
      # scripts/seed.py is gated at 100% in unit-tests, so this job gates no coverage of
      # its own. The gate it used to carry was over lib/python/test_http_doubles, the stub
      # API these tests drive seed against, and it went to test-repo-libraries with the
      # tests that earn it.
      - name: Run integration tests against a mocked and a stubbed API
        run: >-
          PYTHONPATH=.:lib/python:scripts:test:src/api/endpoints/tenants/wan/post/lambdas
          python3 -m pytest
          test/scripts/seed/pre_deployment/integration/
          --import-mode=importlib --confcutdir=test
          --verbose --pythonwarnings=error
  seeding:
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' && (needs.concluding-testing-unnecessary.result == 'success' || needs.integration-tests.result == 'success') }}
    name: seeding
    needs:
      - concluding-testing-unnecessary
      - integration-tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Install tools
        run: pip install pyyaml
      - name: Push the git-authored inputs to the API
        run: PYTHONPATH=lib/python python3 scripts/seed.py
  static-analysis:
    if: ${{ !cancelled() && needs.concluding-testing-necessary.result == 'success' }}
    name: static-analysis
    needs: concluding-testing-necessary
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Install tools
        run: |
          pip install \
            assert-no-inline-directives \
            assert-no-linter-config-files \
            assert-one-assert-per-pytest \
            boto3 boto3-stubs botocore-stubs mypy pylint pytest pyyaml \
            'python-hcl2<8' types-PyYAML yamllint
          npm install -g jscpd
      - name: Lint YAML
        run: |
          EMPTY='empty-lines: {max: 0, max-start: 0, max-end: 1}'
          KEY='key-ordering: enable'
          LL='line-length: disable'
          NL='new-line-at-end-of-file: enable'
          TR='truthy: {allowed-values: ["true", "false", "on"]}'
          RULES="$EMPTY, $KEY, $LL, $NL, $TR"
          yamllint --strict \
            --config-data \
            "{extends: default, rules: {$RULES}}" \
            .github/workflows/seed.yml
      - name: Assert no inline directives
        run: >-
          assert-no-inline-directives
          --tools pylint,mypy,yamllint
          --verbose
          ${{ github.workspace }}/lib/python ${{ github.workspace }}/scripts ${{ github.workspace }}/test/scripts
          ${{ github.workspace }}/test/lib/python/repo_utils
          ${{ github.workspace }}/test/lib/python/test_http_doubles
      - name: Assert no linter config files
        run: >-
          assert-no-linter-config-files
          --linters pylint,mypy,yamllint
          --verbose
          ${{ github.workspace }}
      - name: Assert one assert per pytest
        run: >-
          assert-one-assert-per-pytest
          --verbose
          ${{ github.workspace }}/test/scripts/seed
          ${{ github.workspace }}/test/lib/python/repo_utils
          ${{ github.workspace }}/test/lib/python/test_http_doubles
      # lib/python/test_published_designs reads a published WAN from the API and measures
      # it with the synthesizer's own distance helper, so scripts/ and the synthesizer are
      # both on the path here: pylint reads every import it is asked to lint, and that
      # module imports the API base and the sender from scripts/seed.py.
      - name: Run pylint on source
        run: >-
          PYTHONPATH=lib/python:scripts:src/api/endpoints/tenants/wan/post/lambdas
          python3 -m pylint
          scripts/seed.py lib/python/
          --fail-on=C,R,W --fail-under=10.0
      - name: Run mypy on source
        run: >-
          MYPYPATH=lib/python:scripts
          python3 -m mypy --strict --ignore-missing-imports
          --explicit-package-bases scripts/seed.py lib/python/
      - name: Detect copy-paste in source
        run: >-
          jscpd --pattern "**/*.py" --threshold 0 --reporters console
          scripts/seed.py lib/python/
      - name: Run pylint on tests
        run: >-
          PYTHONPATH=.:lib/python:scripts:test:src/api/endpoints/tenants/wan/post/lambdas
          python3 -m pylint --recursive=y
          test/scripts/seed/
          test/lib/python/repo_utils
          test/lib/python/test_http_doubles
          --fail-on=C,R,W --fail-under=10.0
      - name: Run mypy on tests
        run: >-
          MYPYPATH=lib/python:scripts:test:src/api/endpoints/tenants/wan/post/lambdas
          python3 -m mypy --strict
          --explicit-package-bases test/scripts/seed/
          test/lib/python/repo_utils
          test/lib/python/test_http_doubles
      - name: Detect copy-paste in tests
        run: >-
          jscpd --pattern "**/*.py" --threshold 0
          --reporters console test/scripts/seed/
          test/lib/python/repo_utils
          test/lib/python/test_http_doubles
  # The nine modules under lib/python/ are the fixtures, doubles, loaders and readers the
  # rest of the suite is written on top of, and this job is where they are the subject
  # rather than the setup. Without it a defect in one of them reaches the reader as a
  # failure in whatever tier consumed it, named for the subject that tier was testing: a
  # probe that reads a present log group as absent fails a post-deployment tier and names
  # the log group, and no result anywhere names the module that was wrong (GitHub issue
  # #53).
  #
  # Two shapes were proposed for this and neither works. A workflow of its own, named for
  # lib/python/ the way this one is named for scripts/seed.py, cannot put itself ahead of
  # the eleven workflows that consume the modules: GitHub Actions orders nothing between
  # workflows started by the same push, and this repository declares no workflow_run or
  # workflow_call to build an order from. An expression `if` reading this job's result is
  # not a substitute for the needs: edges either, because a job that only reads another
  # job's result can start before that job has finished.
  #
  # Every workflow runs every module's tests, not only the ones its own tests import.
  # Scoping the job to what a workflow imports would make its contents a function of an
  # import graph nobody maintains, so a new import would silently widen what should have
  # been checked and nothing would report that it had not. The modules are pure Python
  # exercised against literals, so running all nine costs little.
  #
  # GitHub issue #56 proposes redrawing the needs: edges below so the jobs run
  # concurrently. Whichever of the two lands second, these edges are the ones to keep: a
  # run that carries on past a broken module still POSTs the builds in seeding and then
  # waits up to the 900 seconds of _BUILD_DEADLINE_SECONDS in
  # test/scripts/seed/post_deployment/e2e/conftest.py for results that will be thrown
  # away, and a reader facing eleven red jobs has to be told which one to read, where one
  # red job and ten skipped ones has already told them.
  test-repo-libraries:
    if: ${{ !cancelled() && needs.static-analysis.result == 'success' }}
    name: test-repo-libraries
    needs: static-analysis
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Install tools
        run: pip install boto3 pytest pytest-cov 'python-hcl2<8' pyyaml
      # Each module is named in a --cov of its own rather than lib/python covered as a
      # whole, so the next module to arrive without tests fails here instead of being
      # carried by its neighbours' numbers (GitHub issue #52).
      - name: Run the shared modules' unit tests with a 100% coverage gate
        run: >-
          PYTHONPATH=.:lib/python:scripts:src:test:src/api/endpoints/tenants/wan/post/lambdas
          python3 -m pytest
          test/lib/python/repo_utils/pre_deployment/unit/
          test/lib/python/test_fixtures/pre_deployment/unit/
          test/lib/python/test_handler_contracts/pre_deployment/unit/
          test/lib/python/test_http_doubles/pre_deployment/unit/
          test/lib/python/test_module_utils/pre_deployment/unit/
          test/lib/python/test_published_designs/pre_deployment/unit/
          test/lib/python/test_s3_store_mock/pre_deployment/unit/
          test/lib/python/test_terraform_config/pre_deployment/unit/
          test/lib/python/test_terraform_drift/pre_deployment/unit/
          --import-mode=importlib --confcutdir=test
          --verbose --pythonwarnings=error
          --cov=lib/python/repo_utils
          --cov=lib/python/test_fixtures
          --cov=lib/python/test_handler_contracts
          --cov=lib/python/test_module_utils
          --cov=lib/python/test_published_designs
          --cov=lib/python/test_s3_store_mock
          --cov=lib/python/test_terraform_config
          --cov=lib/python/test_terraform_drift
          --cov-branch
          --cov-report=term-missing
          --cov-fail-under=100
      # test_http_doubles is the ninth module and is gated here rather than on the step
      # above. It publishes a stub API server, and the code that answers a request only
      # runs when a client sends one, which its integration tests do and its unit tests do
      # not. Coverage is counted per pytest run, so this step takes both of its tiers.
      - name: Run the shared modules' integration tests with a 100% coverage gate
        run: >-
          PYTHONPATH=.:lib/python:scripts:src:test:src/api/endpoints/tenants/wan/post/lambdas
          python3 -m pytest
          test/lib/python/test_handler_contracts/pre_deployment/integration/
          test/lib/python/test_http_doubles/pre_deployment/
          test/lib/python/test_published_designs/pre_deployment/integration/
          test/lib/python/test_terraform_config/pre_deployment/integration/
          --import-mode=importlib --confcutdir=test
          --verbose --pythonwarnings=error
          --cov=lib/python/test_http_doubles
          --cov-branch
          --cov-report=term-missing
          --cov-fail-under=100
  unit-tests:
    if: ${{ !cancelled() && needs.test-repo-libraries.result == 'success' }}
    name: unit-tests
    needs: test-repo-libraries
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Install tools
        run: pip install pytest pytest-cov pyyaml
      # What remains gated here is scripts/seed.py, at 100% of its branches. The two shared
      # modules this workflow's own tests import, repo_utils and test_http_doubles, are
      # gated in test-repo-libraries, which every job here that imports them runs after.
      - name: Run unit tests with a 100% coverage gate
        run: >-
          PYTHONPATH=.:lib/python:scripts
          python3 -m pytest
          test/scripts/seed/pre_deployment/unit/
          --import-mode=importlib --confcutdir=test
          --verbose --pythonwarnings=error
          --cov=seed
          --cov-branch
          --cov-report=term-missing
          --cov-fail-under=100
  yamllint:
    name: yamllint
    needs: concluding-yamllint-necessary
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Install tools
        run: pip install assert-no-inline-directives yamllint
      - name: Assert no inline directives
        run: >-
          assert-no-inline-directives
          --tools yamllint
          --verbose
          .github/workflows/seed.yml etc/
      - name: Lint YAML
        run: |
          EMPTY='empty-lines: {max: 0, max-start: 0, max-end: 1}'
          KEY='key-ordering: enable'
          LL='line-length: disable'
          NL='new-line-at-end-of-file: enable'
          TR='truthy: {allowed-values: ["true", "false", "on"]}'
          RULES="$EMPTY, $KEY, $LL, $NL, $TR"
          yamllint --strict \
            --config-data \
            "{extends: default, rules: {$RULES}}" \
            .github/workflows/seed.yml etc/afgsc.yml etc/daf.yml \
            etc/dow.yml etc/f_35.yml etc/minuteman.yml
name: seed
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/seed.yml
      - data/**
      - etc/**
      - lib/python/**
      - scripts/**
      - src/www/api/openapi.json
      # The tests over the nine shared modules in lib/python/. test-repo-libraries runs
      # every one of them rather than the subset this workflow's own tests import, so a
      # change to any of them has to be able to start this workflow.
      - test/lib/python/**
      - test/scripts/seed/**
  workflow_dispatch: {}
