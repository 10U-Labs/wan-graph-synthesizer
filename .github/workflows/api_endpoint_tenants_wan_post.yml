---
concurrency:
  cancel-in-progress: false
  group: api-endpoint-tenants-wan-post-${{ github.ref }}
jobs:
  assert-no-inline-directives:
    name: assert-no-inline-directives
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install tools
        run: pip install assert-no-inline-directives
      - name: Assert no inline directives
        run: >-
          assert-no-inline-directives
          --tools pylint,mypy,yamllint
          --verbose
          ${{ github.workspace }}/lib/python
          ${{ github.workspace }}/src/api/endpoints/tenants/wan/post/lambdas/synthesizer
          ${{ github.workspace }}/test/api/endpoints/tenants/wan/post
          ${{ github.workspace }}/test/lib/python/test_published_designs
          ${{ github.workspace }}/test/lib/python/repo_utils
          ${{ github.workspace }}/test/lib/python/test_fixtures
          ${{ github.workspace }}/test/lib/python/test_module_utils
          ${{ github.workspace }}/test/lib/python/test_s3_store_mock
          ${{ github.workspace }}/test/lib/python/test_terraform_config
  assert-no-linter-config-files:
    name: assert-no-linter-config-files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install tools
        run: pip install assert-no-linter-config-files
      - name: Assert no linter config files
        run: >-
          assert-no-linter-config-files
          --linters pylint,mypy,yamllint
          --verbose
          ${{ github.workspace }}
  assert-one-assert-per-pytest:
    name: assert-one-assert-per-pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install tools
        run: pip install assert-one-assert-per-pytest
      - name: Assert one assert per pytest
        run: >-
          assert-one-assert-per-pytest
          --verbose
          ${{ github.workspace }}/test/api/endpoints/tenants/wan/post
          ${{ github.workspace }}/test/lib/python/test_published_designs
          ${{ github.workspace }}/test/lib/python/repo_utils
          ${{ github.workspace }}/test/lib/python/test_fixtures
          ${{ github.workspace }}/test/lib/python/test_module_utils
          ${{ github.workspace }}/test/lib/python/test_s3_store_mock
          ${{ github.workspace }}/test/lib/python/test_terraform_config
  copy-paste-source:
    name: copy-paste-source
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install tools
        run: npm install -g jscpd
      - name: Detect copy-paste in source
        run: >-
          jscpd --pattern "**/*.py" --threshold 0 --reporters console
          lib/python/ src/api/endpoints/tenants/wan/post/lambdas/synthesizer/
  copy-paste-tests:
    name: copy-paste-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install tools
        run: npm install -g jscpd
      - name: Detect copy-paste in tests
        run: >-
          jscpd --pattern "**/*.py"
          --threshold 0 --reporters console
          --ignore "test/**/pre_deployment/unit/test_handler.py"
          test/api/endpoints/tenants/wan/post
          test/lib/python/test_published_designs
          test/lib/python/repo_utils
          test/lib/python/test_fixtures
          test/lib/python/test_module_utils
          test/lib/python/test_s3_store_mock
          test/lib/python/test_terraform_config
  lint-yaml:
    name: lint-yaml
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install tools
        run: pip install yamllint
      - name: Lint YAML
        run: |
          EMPTY='empty-lines: {max: 0, max-start: 0, max-end: 1}'
          KEY='key-ordering: enable'
          LL='line-length: disable'
          NL='new-line-at-end-of-file: enable'
          TR='truthy: {allowed-values: ["true", "false", "on"]}'
          RULES="$EMPTY, $KEY, $LL, $NL, $TR"
          yamllint --strict \
            --config-data \
            "{extends: default, rules: {$RULES}}" \
            .github/workflows/api_endpoint_tenants_wan_post.yml
  mypy-source:
    name: mypy-source
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install tools
        run: pip install mypy boto3 boto3-stubs pytest pyyaml types-PyYAML
      - name: Run mypy on source
        run: >-
          MYPYPATH=lib/python:src:src/api/endpoints/tenants/wan/post/lambdas
          python3 -m mypy --strict --ignore-missing-imports
          --explicit-package-bases src/api/endpoints/tenants/wan/post/lambdas/synthesizer/
  mypy-tests:
    name: mypy-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install tools
        run: pip install mypy boto3 boto3-stubs pytest pyyaml types-PyYAML
      - name: Run mypy on tests
        run: >-
          MYPYPATH=lib/python:scripts:test:src/api/endpoints/tenants/wan/post/lambdas
          python3 -m mypy --strict --ignore-missing-imports
          --explicit-package-bases test/api/endpoints/tenants/wan/post
          test/lib/python/test_published_designs
          test/lib/python/repo_utils
          test/lib/python/test_fixtures
          test/lib/python/test_module_utils
          test/lib/python/test_s3_store_mock
          test/lib/python/test_terraform_config
  post-deployment-integration-tests:
    if: github.ref == 'refs/heads/main'
    name: post-deployment-integration-tests
    needs:
      - reconciliation
      - test-repo-libraries
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v5
        with:
          aws-region: us-east-2
          role-to-assume: ${{ vars.OIDC_ROLE_ARN }}
      - name: Install tools
        run: pip install boto3 boto3-stubs pytest 'python-hcl2<8' pyyaml
      # These three files measure the shape of what was just deployed: the synthesizer
      # exists, its runtime and memory match the declaration, and its role can reach the
      # store. None of them reads a design. Whether the configs in etc/ synthesize into the
      # networks they ask for is asked by test/scripts/seed/post_deployment/e2e/, which runs
      # in seed.yml after its seeding job: measuring a published network is only meaningful
      # once the config it is measured against has been delivered and rebuilt, and seeding
      # is what does that (GitHub issues #47 and #49).
      - name: Run post-deployment integration tests against live AWS
        run: >-
          PYTHONPATH=.:lib/python
          python3 -m pytest
          test/api/endpoints/tenants/wan/post/post_deployment/integration/
          --import-mode=importlib --confcutdir=test
          --verbose
  pre-deployment-integration-tests:
    name: pre-deployment-integration-tests
    needs: test-repo-libraries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install tools
        run: pip install boto3 boto3-stubs pytest 'python-hcl2<8' pyyaml
      - name: Run pre-deployment integration tests
        run: >-
          PYTHONPATH=.:lib/python:scripts:src:src/api/endpoints/tenants/wan/post/lambdas
          python3 -m pytest
          test/api/endpoints/tenants/wan/post/pre_deployment/integration/
          --verbose --pythonwarnings=error
  pylint-source:
    name: pylint-source
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install tools
        run: pip install pylint boto3 boto3-stubs pytest pyyaml types-PyYAML
      # This source lint disables pylint's broad-exception-caught (W0718) check.
      # post/lambdas/synthesizer/handler.py is the synthesizer Lambda that builds a tenant's
      # WAN, and it deliberately wraps the whole build in a catch-all
      # `except Exception`. The synthesizer's contract is to record the tenant's status
      # in S3 -- "building" when it starts, "ready" on success, and "failed" on ANY
      # failure -- so that a customer polling for their WAN always reaches a terminal
      # answer. The expected failure (an infeasible design) is a ValueError, but it
      # is not the only thing that can go wrong: reading the substrate and tenant
      # inputs from S3 can raise a boto error, and an unforeseen bug can raise
      # anything at all. If such an error were allowed to escape, the synthesizer would
      # exit with the status still on "building", and the customer would wait forever
      # for a result that never resolves. The catch-all is what guarantees every
      # run ends by writing a terminal status. pylint flags catch-all handlers
      # because they usually hide bugs, which is a sound default, but here turning
      # any failure into a recorded "failed" status is precisely the job of this
      # top-level task runner. Because this repo forbids both inline
      # `# pylint: disable` comments and linter config files, the suppression is
      # expressed as a command-line flag on this job's pylint run.
      #
      # --max-attributes is raised to 8 for the same reason. DesignInputs is the
      # precomputed read-only context the whole backbone search shares -- vertices,
      # edges, adjacency, the all-pairs shortest paths, and the carrier graph's
      # 2-edge-connected component map (the fiber-resilience oracle). These are one
      # cohesive bundle computed once and threaded through the search; splitting them
      # to satisfy the default of 7 would scatter a single concept, so the limit is
      # nudged by one rather than the data artificially partitioned.
      - name: Run pylint on source
        run: >-
          PYTHONPATH=lib/python:src:src/api/endpoints/tenants/wan/post/lambdas
          python3 -m pylint
          src/api/endpoints/tenants/wan/post/lambdas/synthesizer/
          --disable=broad-exception-caught
          --max-attributes=8
          --fail-on=C,R,W --fail-under=10.0
  pylint-tests:
    name: pylint-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install tools
        run: pip install pylint boto3 boto3-stubs pytest pyyaml types-PyYAML
      - name: Run pylint on tests
        run: >-
          PYTHONPATH=.:lib/python:scripts:src:test:src/api/endpoints/tenants/wan/post/lambdas
          python3 -m pylint --recursive=y
          test/api/endpoints/tenants/wan/post
          test/lib/python/test_published_designs
          test/lib/python/repo_utils
          test/lib/python/test_fixtures
          test/lib/python/test_module_utils
          test/lib/python/test_s3_store_mock
          test/lib/python/test_terraform_config
          --fail-on=C,R,W --fail-under=10.0
  reconciliation:
    if: github.ref == 'refs/heads/main'
    name: reconciliation
    needs:
      - assert-no-inline-directives
      - assert-no-linter-config-files
      - assert-one-assert-per-pytest
      - copy-paste-source
      - copy-paste-tests
      - lint-yaml
      - mypy-source
      - mypy-tests
      - pre-deployment-integration-tests
      - pylint-source
      - pylint-tests
      - test-repo-libraries
      - unit-tests
      - validate-stack
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v5
        with:
          aws-region: us-east-2
          role-to-assume: ${{ vars.OIDC_ROLE_ARN }}
      - name: Set up OpenTofu
        uses: opentofu/setup-opentofu@v2
        with:
          tofu_wrapper: false
      - name: Reconcile the synthesizer stack to its declared state
        run: |
          tofu -chdir=src/api/endpoints/tenants/wan/post init -input=false
          tofu -chdir=src/api/endpoints/tenants/wan/post apply -auto-approve -input=false
  # The nine modules under lib/python/ are the fixtures, doubles, loaders and readers the
  # rest of the suite is written on top of, and this job is where they are the subject
  # rather than the setup. Without it a defect in one of them reaches the reader as a
  # failure in whatever tier consumed it, named for the subject that tier was testing: a
  # probe that reads a present log group as absent fails a post-deployment tier and names
  # the log group, and no result anywhere names the module that was wrong (GitHub issue
  # #53).
  #
  # Two shapes were proposed for this and neither works. A workflow of its own, named for
  # lib/python/ the way seed.yml is named for scripts/seed.py, cannot put itself ahead of
  # the eleven workflows that consume the modules: GitHub Actions orders nothing between
  # workflows started by the same push, and this repository declares no workflow_run or
  # workflow_call to build an order from. An expression `if` reading this job's result is
  # not a substitute for the needs: edges either, because a job that only reads another
  # job's result can start before that job has finished.
  #
  # Every workflow runs every module's tests, not only the ones its own tests import.
  # Scoping the job to what a workflow imports would make its contents a function of an
  # import graph nobody maintains, so a new import would silently widen what should have
  # been checked and nothing would report that it had not. The modules are pure Python
  # exercised against literals, so running all nine costs little.
  #
  # GitHub issue #56 redrew the edges around this job. The eleven static-analysis checks
  # are eleven jobs now and all start when the workflow does, and this job starts with them
  # rather than behind them: a check costs seconds and produces nothing anyone waits on, so
  # holding the shared modules behind one bought nothing. The edges out of this job
  # survived. unit-tests and pre-deployment-integration-tests still wait on it, because a
  # reader facing eleven red consumers has to be told which shared module broke them, where
  # one red job and ten skipped ones has already told them. reconciliation waits on it too,
  # along with every other gate in the workflow, because it runs tofu apply against live
  # AWS: a tier's result can be disbelieved after the fact, an apply cannot be taken back,
  # and a run that carries on past a broken module spends that apply and its post-deployment
  # tier on results that will be thrown away.
  test-repo-libraries:
    name: test-repo-libraries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install tools
        run: pip install boto3 pytest pytest-cov 'python-hcl2<8' pyyaml
      # Each module is named in a --cov of its own rather than lib/python covered as a
      # whole, so the next module to arrive without tests fails here instead of being
      # carried by its neighbours' numbers (GitHub issue #52).
      - name: Run the shared modules' unit tests with a 100% coverage gate
        run: >-
          PYTHONPATH=.:lib/python:scripts:src:test:src/api/endpoints/tenants/wan/post/lambdas
          python3 -m pytest
          test/lib/python/repo_utils/pre_deployment/unit/
          test/lib/python/test_fixtures/pre_deployment/unit/
          test/lib/python/test_handler_contracts/pre_deployment/unit/
          test/lib/python/test_http_doubles/pre_deployment/unit/
          test/lib/python/test_module_utils/pre_deployment/unit/
          test/lib/python/test_published_designs/pre_deployment/unit/
          test/lib/python/test_s3_store_mock/pre_deployment/unit/
          test/lib/python/test_terraform_config/pre_deployment/unit/
          test/lib/python/test_terraform_drift/pre_deployment/unit/
          --import-mode=importlib --confcutdir=test
          --verbose --pythonwarnings=error
          --cov=lib/python/repo_utils
          --cov=lib/python/test_fixtures
          --cov=lib/python/test_handler_contracts
          --cov=lib/python/test_module_utils
          --cov=lib/python/test_published_designs
          --cov=lib/python/test_s3_store_mock
          --cov=lib/python/test_terraform_config
          --cov=lib/python/test_terraform_drift
          --cov-branch
          --cov-report=term-missing
          --cov-fail-under=100
      # test_http_doubles is the ninth module and is gated here rather than on the step
      # above. It publishes a stub API server, and the code that answers a request only
      # runs when a client sends one, which its integration tests do and its unit tests do
      # not. Coverage is counted per pytest run, so this step takes both of its tiers.
      - name: Run the shared modules' integration tests with a 100% coverage gate
        run: >-
          PYTHONPATH=.:lib/python:scripts:src:test:src/api/endpoints/tenants/wan/post/lambdas
          python3 -m pytest
          test/lib/python/test_handler_contracts/pre_deployment/integration/
          test/lib/python/test_http_doubles/pre_deployment/
          test/lib/python/test_published_designs/pre_deployment/integration/
          test/lib/python/test_terraform_config/pre_deployment/integration/
          --import-mode=importlib --confcutdir=test
          --verbose --pythonwarnings=error
          --cov=lib/python/test_http_doubles
          --cov-branch
          --cov-report=term-missing
          --cov-fail-under=100
  unit-tests:
    name: unit-tests
    needs: test-repo-libraries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install tools
        run: pip install boto3 boto3-stubs pytest pytest-cov 'python-hcl2<8' pyyaml
      # What remains gated here is the synthesizer this workflow deploys, at 100% of its
      # branches. The shared modules its tests import are gated in test-repo-libraries,
      # which every job in this workflow that imports them runs after.
      - name: Run unit tests with a 100% coverage gate
        run: >-
          PYTHONPATH=.:lib/python:scripts:src:src/api/endpoints/tenants/wan/post/lambdas
          python3 -m pytest
          test/api/endpoints/tenants/wan/post/pre_deployment/unit/
          --import-mode=importlib --confcutdir=test
          --verbose --pythonwarnings=error
          --cov=src/api/endpoints/tenants/wan/post/lambdas/synthesizer
          --cov-branch
          --cov-report=term-missing
          --cov-fail-under=100
  validate-stack:
    name: validate-stack
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Set up OpenTofu
        uses: opentofu/setup-opentofu@v2
        with:
          tofu_wrapper: false
      - name: Validate the synthesizer stack
        run: |
          tofu -chdir=src/api/endpoints/tenants/wan/post init -backend=false -input=false
          tofu -chdir=src/api/endpoints/tenants/wan/post validate
name: api_endpoint_tenants_wan_post
on:
  push:
    branches: [main]
    paths:
      - src/api/endpoints/tenants/wan/post/**
      - test/api/endpoints/tenants/wan/conftest.py
      - test/api/endpoints/tenants/wan/post/**
      # The tests over the nine shared modules in lib/python/. test-repo-libraries runs
      # every one of them rather than the subset this workflow's own tests import, so a
      # change to any of them has to be able to start this workflow.
      - test/lib/python/**
      # The shared test support this endpoint's tests are the only importers of; a change
      # to it can break them, so it has to be able to trigger them.
      - test/fixtures.py
      - lib/python/**
      - lib/opentofu/common/**
      # The list of what the API serves. The delivered-design layer's reader is held
      # against it before deployment, so a path renamed or withdrawn here has to be able
      # to fail that check.
      - src/www/api/openapi.json
      # The unit and contract tests over the measuring helpers reach the API base and the
      # sender through seed's rules, so a change to them is a change to what those tests
      # read. etc/ is deliberately not here: a config change needs no tofu apply over the
      # synthesizer stack, and seed.yml both delivers it and measures the networks it
      # rebuilds, so triggering this workflow too would only deploy a second time.
      - scripts/**
      - .github/workflows/api_endpoint_tenants_wan_post.yml
  workflow_dispatch: {}
